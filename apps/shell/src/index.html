<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discovery</title>
    <!-- Declared inline so the document asks for no second file. Without it a
         browser requests /favicon.ico on every load and the dev server answers
         404, which buries a real failed request in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f1a'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='600' fill='%237dd3fc' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- The theme, before first paint. The shell remembers it, and a document
         that boots dark and then flips to light on hydration is a flash every
         light-theme user sees on every load. The module below decides the same
         value the same way; this only applies it early.

         What it reads is the store's envelope under `@host:theme` —
         `{"v":1,"r":"browser","d":"light"}`, `d` being the payload — read
         defensively, because this script must never be why a page fails to
         paint. -->
    <script>
      ;(function () {
        try {
          var stored = null
          var raw = window.localStorage.getItem('@host:theme')
          if (raw) {
            var record = JSON.parse(raw)
            if (record && (record.d === 'light' || record.d === 'dark')) stored = record.d
          }
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          // Storage blocked, or a record this build cannot read: the class in
          // <html> already stands.
        }
      })()
    </script>
  </body>
</html>
