<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discovery</title>
    <!-- Inline, or a browser requests /favicon.ico on every load and the 404 buries a real failed request in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f1a'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='600' fill='%237dd3fc' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E"
    />
    <!-- The loading screen paints before any stylesheet or script arrives, so it cannot wait for
         Tecton's: each value names the Tecton token first and falls back to that token's own value
         for the mode, which is what it resolves to once globals.css loads (§36). -->
    <style>
      #shell-loader {
        --loader-bg: var(--tecton-color-bg-default, #1d1c1f);
        --loader-text: var(--tecton-color-text-primary, #f6f5f8);
        --loader-muted: var(--tecton-color-text-secondary, #a7a2ac);
        --loader-subtle: var(--tecton-color-text-subtlest, #89848e);
        --loader-accent: var(--tecton-palette-saffron-560, #cb8553);
        --loader-button: var(--tecton-color-action-secondary-bg, #3a343e);
        --loader-button-hover: var(--tecton-color-action-secondary-bg-hover, #514659);
        --loader-ring: var(--tecton-color-focus-ring, #ff00aa);
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 16px;
        overflow: hidden;
        background: var(--loader-bg);
        color: var(--loader-text);
        font-family:
          Figtree,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      html:not(.dark) #shell-loader {
        --loader-bg: var(--tecton-color-bg-default, #f6f4f7);
        --loader-text: var(--tecton-color-text-primary, #21172a);
        --loader-muted: var(--tecton-color-text-secondary, #604e6e);
        --loader-subtle: var(--tecton-color-text-subtlest, #7b668b);
        --loader-accent: var(--tecton-palette-saffron-310, #d1722e);
        --loader-button: var(--tecton-color-action-secondary-bg, #e4dde7);
        --loader-button-hover: var(--tecton-color-action-secondary-bg-hover, #ece8f0);
      }
      #shell-loader[data-state='done'] {
        opacity: 0;
        pointer-events: none;
      }

      /* A soft light behind the mark, as if from the prospect; decoration only. */
      .shell-loader__glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 520px;
        height: 520px;
        margin: -300px 0 0 -260px;
        border-radius: 50%;
        background: radial-gradient(closest-side, var(--loader-accent), transparent);
        opacity: 0.07;
        pointer-events: none;
      }
      html:not(.dark) .shell-loader__glow {
        opacity: 0.05;
      }

      /* A fast sign-in or boot never shows the scene: the backdrop is immediate, the scene waits a beat. */
      .shell-loader__scene {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 340px;
        text-align: center;
        animation: shell-loader-enter 700ms cubic-bezier(0.16, 1, 0.3, 1) 120ms both;
        transition:
          opacity 300ms ease,
          transform 500ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #shell-loader[data-state='done'] .shell-loader__scene {
        opacity: 0;
        transform: scale(0.98);
      }

      /* A structure map of the prospect: contour rings spread from it like a seismic wave, each
         fading as it widens, around a point of light where the oil is. */
      .shell-loader__art {
        width: 176px;
        height: 176px;
        overflow: visible;
      }
      .shell-loader__art .contour {
        fill: none;
        stroke: var(--loader-text);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      /* At rest, and with reduced motion, the rings stand as a finished map. */
      .shell-loader__art .ring {
        transform-box: view-box;
        transform-origin: 100px 100px;
        transform: rotate(calc(var(--i) * 2.5deg - 10deg)) scale(calc((var(--i) + 1) / 9));
        opacity: calc(0.5 - var(--i) * 0.05);
        animation: shell-loader-ring 7.2s linear infinite;
        animation-delay: calc(var(--i) * -0.8s);
      }
      .shell-loader__art .core,
      .shell-loader__art .halo {
        fill: var(--loader-accent);
      }
      .shell-loader__art .halo {
        transform-box: view-box;
        transform-origin: 100px 100px;
        opacity: 0.16;
        animation: shell-loader-halo 2.7s ease-in-out infinite;
      }
      .shell-loader__title {
        margin: 20px 0 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 20px;
        letter-spacing: -0.005em;
      }
      .shell-loader__status {
        min-height: 18px;
        margin: 6px 0 0;
        font-size: 13px;
        line-height: 18px;
        color: var(--loader-muted);
      }
      .shell-loader__detail {
        margin: 8px 0 0;
        font-size: 13px;
        line-height: 18px;
        color: var(--loader-muted);
        text-wrap: pretty;
      }
      .shell-loader__detail:empty {
        display: none;
      }
      .shell-loader__action {
        height: 32px;
        margin-top: 20px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--loader-button);
        color: var(--loader-text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      .shell-loader__action:hover {
        background: var(--loader-button-hover);
      }
      .shell-loader__action:focus-visible {
        outline: 2px solid var(--loader-ring);
        outline-offset: 2px;
      }

      /* A failure stills the map: nothing moves until the user acts. */
      #shell-loader[data-state='error'] .shell-loader__art * {
        animation: none;
      }
      #shell-loader[data-state='error'] .shell-loader__art .core {
        fill: var(--loader-subtle);
      }
      #shell-loader[data-state='error'] .shell-loader__art .halo,
      #shell-loader[data-state='error'] .shell-loader__glow {
        opacity: 0;
      }
      #shell-loader[data-state='error'] .shell-loader__status {
        color: var(--loader-text);
        font-weight: 500;
      }

      /* Opacity only: a transform here would capture the shell's fixed-position overlays. */
      #root {
        transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1) 80ms;
      }
      html:not([data-shell='ready']) #root {
        opacity: 0;
      }

      @keyframes shell-loader-enter {
        from {
          opacity: 0;
          transform: translateY(6px);
          filter: blur(3px);
        }
      }
      /* Born at the prospect, brightest while close, gone by the edge of the map. */
      /* Each ring turns a little as it widens, so the nested contours never quite align: the
         irregular spacing of a real structure map rather than ripples on a pond. */
      @keyframes shell-loader-ring {
        0% {
          transform: rotate(-12deg) scale(0.04);
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        60% {
          opacity: 0.2;
        }
        92%,
        100% {
          opacity: 0;
        }
        100% {
          transform: rotate(12deg) scale(1);
          opacity: 0;
        }
      }
      @keyframes shell-loader-halo {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.12;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.22;
        }
      }
      /* Reduced motion: the finished map, standing still. */
      @media (prefers-reduced-motion: reduce) {
        #shell-loader,
        #root,
        .shell-loader__scene,
        .shell-loader__art * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The structure map of a prospect, its contours spreading like a seismic wave, while sign-in
         and boot run. `loader.ts` changes its words and removes it; it never needs React. -->
    <div id="shell-loader" data-state="loading">
      <div class="shell-loader__glow"></div>
      <div class="shell-loader__scene">
        <svg class="shell-loader__art" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path
              id="shell-loader-contour"
              class="contour"
              d="M87.5 28.9 C104.6 25.3 128.1 24.5 142.7 30.5 C157.2 36.5 167.4 52.3 175 65.2 C182.6 78 189.8 93.1 188.3 107.6 C186.7 122.1 178.6 142.1 165.9 152.4 C153.3 162.7 129.6 167.9 112.2 169.4 C94.9 171 77.4 167.3 62 161.9 C46.5 156.6 28.7 149 19.7 137.3 C10.6 125.7 4.5 106.3 7.8 92.1 C11.1 77.9 26.3 62.6 39.6 52 C52.9 41.5 70.3 32.5 87.5 28.9 Z"
            />
          </defs>
          <use class="ring" href="#shell-loader-contour" style="--i: 0" />
          <use class="ring" href="#shell-loader-contour" style="--i: 1" />
          <use class="ring" href="#shell-loader-contour" style="--i: 2" />
          <use class="ring" href="#shell-loader-contour" style="--i: 3" />
          <use class="ring" href="#shell-loader-contour" style="--i: 4" />
          <use class="ring" href="#shell-loader-contour" style="--i: 5" />
          <use class="ring" href="#shell-loader-contour" style="--i: 6" />
          <use class="ring" href="#shell-loader-contour" style="--i: 7" />
          <use class="ring" href="#shell-loader-contour" style="--i: 8" />
          <circle class="halo" cx="100" cy="100" r="13" />
          <circle class="core" cx="100" cy="100" r="3.5" />
        </svg>
        <p class="shell-loader__title">Discovery</p>
        <p class="shell-loader__status" data-part="status" role="status" aria-live="polite">
          Loading…
        </p>
        <p class="shell-loader__detail" data-part="detail"></p>
        <button class="shell-loader__action" data-part="action" type="button" hidden></button>
      </div>
    </div>
    <!-- The theme before first paint, because a document that boots dark and flips to light on
         hydration is a flash every light-theme user sees on every load. It reads the bare key
         the legacy Angular applications read too, the same way `preferences.ts` does (§24). -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('theme')
          if (stored !== 'light' && stored !== 'dark') stored = null
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          // Storage blocked, or a value this build cannot read: the class in <html> already stands.
        }
      })()
    </script>
  </body>
</html>
