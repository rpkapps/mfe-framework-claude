name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This repository is checked out into its own directory, so the design system can be cloned to
# wherever the @tecton/react override in pnpm-workspace.yaml points (see .github/actions/setup).
jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: mfe-framework-claude
          # The changeset check compares against the base branch, so it needs the history.
          fetch-depth: 0

      - uses: ./mfe-framework-claude/.github/actions/setup

      - name: Generate, format, lint, typecheck, boundaries and test
        working-directory: mfe-framework-claude
        # Type-aware ESLint over the whole workspace needs more than the runner's default heap of
        # about 4 GB, and fails with "JavaScript heap out of memory" under it.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm check

      # Generation must be a pure function of the sources, so a check that regenerated anything
      # means a generated file was committed stale.
      - name: No uncommitted generated changes
        working-directory: mfe-framework-claude
        # `git diff` alone misses a generated file that is new rather than changed.
        run: |
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::The check generated files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      # A change to a published package carries a changeset. One that needs no release note says
      # so with `pnpm changeset --empty`.
      - name: Changeset for every changed package
        if: github.event_name == 'pull_request'
        working-directory: mfe-framework-claude
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

      # The step above reads only the changesets a PR adds, so one already on the base branch that
      # names a package no longer in the workspace would otherwise surface only when releasing.
      # Without `--since` it compares against the `dev` branch by its local name, which a pull
      # request's checkout does not create.
      - name: Every pending changeset names a workspace package
        working-directory: mfe-framework-claude
        run: |
          git rev-parse --verify --quiet refs/heads/dev >/dev/null || git branch dev origin/dev
          pnpm changeset status

  verify-page:
    name: Verify the page in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: mfe-framework-claude

      - uses: ./mfe-framework-claude/.github/actions/setup

      - name: Install Chromium
        working-directory: mfe-framework-claude
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot the shell and every container, and check each page mounts
        working-directory: mfe-framework-claude
        run: pnpm run verify:page

      - name: Upload Storage devtools screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devtools-storage-screenshots
          path: mfe-framework-claude/screenshots/storage-*.png
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: Build docs and verify links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: mfe-framework-claude

      - uses: ./mfe-framework-claude/.github/actions/setup

      - name: Build every documentation page and check links and diagrams
        working-directory: mfe-framework-claude
        run: pnpm docs:check

  # Every PR is reviewed against REVIEW.md by a session that did not write it. Blocking findings
  # fail the job, so a required check keeps them from merging.
  review:
    name: Review against REVIEW.md
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Until the repository has the key, the review is skipped with a warning rather than failing
      # every PR. Add it under Settings, Secrets and variables, Actions to turn the review on.
      - name: Check for the review key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Review skipped: the repository has no ANTHROPIC_API_KEY secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Review this pull request against REVIEW.md. Read REVIEW.md, AGENTS.md, CONTRIBUTING.md
            and, when docs changed, apps/docs/STYLE.md first. The PR branch is checked out, and
            `git diff BASE...HEAD` is the change.

            Post each finding as an inline comment, starting with "Blocking:" or "Minor:". Then post
            one summary comment that lists the blocking findings, or says there are none.

            If there is at least one blocking finding, write one line per blocking finding to the
            file review-blocking.txt in the working directory. Do not create that file otherwise.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Fail on blocking findings
        if: steps.key.outputs.present == 'true'
        run: |
          if [ -s review-blocking.txt ]; then
            echo "::error::The review found blocking problems. They are posted on the PR."
            cat review-blocking.txt
            exit 1
          fi
