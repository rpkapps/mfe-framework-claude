packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
  - 'tools/*'

# §10.10 dependency build-script policy.
# Only explicitly reviewed dependencies may run install/build scripts.
# Unknown build scripts fail installation rather than executing silently.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  # Reviewed: esbuild ships a prebuilt platform binary; its postinstall only
  # links that binary into place. Required by Vitest's transform pipeline.
  esbuild: true
  # Reviewed: lightningcss postinstall selects the prebuilt native binding used
  # by the Tailwind v4 pipeline.
  lightningcss: true
  # Reviewed: unrs-resolver postinstall selects a prebuilt native resolver
  # binding used by eslint-plugin-import-x.
  unrs-resolver: true
  # Denied: msw's postinstall writes a service worker into a public directory.
  # We do not use MSW (§15.1 keeps it optional), so its script must not run.
  msw: false

# §10.10 / §17.6: one pinned version per dependency, referenced as `catalog:`
# from every package so the toolchain cannot drift between workspaces.
catalog:
