packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
  - 'tools/*'

# §10.10 dependency build-script policy.
# Only explicitly reviewed dependencies may run install/build scripts.
# Unknown build scripts fail installation rather than executing silently.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  # Reviewed: esbuild ships a prebuilt platform binary; its postinstall only
  # links that binary into place. Required by Vitest's transform pipeline.
  esbuild: true
  # Reviewed: lightningcss postinstall selects the prebuilt native binding used
  # by the Tailwind v4 pipeline.
  lightningcss: true
  # Reviewed: unrs-resolver postinstall selects a prebuilt native resolver
  # binding used by eslint-plugin-import-x.
  unrs-resolver: true
  # Denied: msw's postinstall writes a service worker into a public directory.
  # We do not use MSW (§15.1 keeps it optional), so its script must not run.
  msw: false
  # Reviewed: nx's postinstall only asserts platform support and, when an nx.json
  # is present, checks Nx Cloud usage; both are no-ops here (this repo has no
  # nx.json — it is not an Nx workspace), and the script exits within 30s either way.
  nx: true

# `@angular/core` 19 declares `zone.js` as a required peer. The Angular adapter runs zoneless
# only and never imports it, so the peer is deliberately absent rather than installed.
peerDependencyRules:
  ignoreMissing:
    - zone.js

# §10.10 / §17.6: one pinned version per dependency, referenced as `catalog:`
# from every package so the toolchain cannot drift between workspaces.
catalog:
  '@angular/common': 19.2.25
  '@angular/compiler': 19.2.25
  '@angular/core': 19.2.25
  '@angular/platform-browser': 19.2.25
  '@angular/router': 19.2.25
  '@babel/core': 8.0.5
  '@changesets/cli': 3.0.3
  '@excalidraw/excalidraw': 0.18.1
  '@module-federation/enhanced': 2.9.0
  '@module-federation/runtime': 2.9.0
  # Pinned for packages/mfe-nx's own tests and typecheck only; the Nx plugin declares its actual
  # `@nx/devkit`/`nx` compatibility as a peerDependency range (see that package's README), since a
  # consumer's workspace picks its own Nx version.
  '@nx/devkit': 22.7.12
  '@playwright/test': 1.63.0
  '@rsbuild/core': 2.2.8
  '@rsbuild/plugin-react': 2.1.0
  '@rspack/cli': 2.2.6
  '@rspack/core': 2.2.6
  '@rspack/dev-server': 2.2.1
  '@rspack/plugin-react-refresh': 2.0.2
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@tanstack/eslint-plugin-query': 5.103.1
  '@tanstack/eslint-plugin-router': 1.162.0
  '@tanstack/react-form': 1.33.5
  '@tanstack/react-query': 5.103.1
  '@tanstack/react-router': 1.170.38
  '@tanstack/react-start': 1.168.52
  '@tanstack/react-table': 9.2.4
  '@tanstack/router-generator': 1.167.38
  '@tanstack/router-plugin': 1.168.40
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/mdx': 2.0.14
  '@types/node': 22.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 5.0.1
  babel-loader: 10.1.1
  babel-plugin-react-compiler: 1.0.0
  browserslist: 4.29.0
  caniuse-lite: 1.0.30001810
  cn: 0.2.6
  concurrently: 10.0.5
  # packages/mfe-nx's webpack integration tests compile with the versions
  # @angular-devkit/build-angular 19.2 itself pins, so they exercise the webpack an Angular
  # container is actually built with.
  css-loader: 7.1.2
  eslint: 10.10.0
  eslint-plugin-react-hooks: 7.1.1
  fumadocs-core: 16.15.9
  fumadocs-mdx: 15.4.0
  globby: 16.2.4
  jiti: 2.7.0
  jsdom: 30.1.0
  lucide-react: 1.45.0
  # Same scope and reason as css-loader above.
  mini-css-extract-plugin: 2.9.2
  next-themes: 0.4.6
  # Same scope as `@nx/devkit` above: packages/mfe-nx's own devDependency for tests.
  nx: 22.7.12
  picocolors: 1.1.1
  postcss: 8.5.28
  postcss-loader: 8.2.1
  prettier: 3.9.8
  react: 19.3.0
  'react-aria-components': 1.21.1
  react-dom: 19.3.0
  rxjs: 7.8.2
  shiki: 4.4.3
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.70.0
  vite: 8.3.0
  vitest: 5.0.1
  # Same scope and reason as css-loader above.
  webpack: 5.98.0
  zod: 4.6.5
# The documentation site (`apps/docs`) is a Vite + TanStack Start application, and
# `@tanstack/react-start` depends on an exact `@tanstack/react-router`. Two copies of the router in
# one bundle leave the server renderer talking to the wrong one ("router.serverSsr
# ?.takeInitialHydrationScriptTags is not a function"), so the site pins the version Start brings
# rather than the one the shell and the examples use. Everything else it needs is in the shared
# catalog above.
catalogs:
  docs:
    '@tanstack/react-router': 1.170.35

